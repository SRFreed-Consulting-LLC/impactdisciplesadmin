<ng-container *ngIf="entries$ | async as entries">
  <button
    mat-icon-button
    [matMenuTriggerFor]="menu"
    [matBadge]="total$ | async"
    matBadgeColor="warn"
    [matBadgeHidden]="entries.length === 0"
    aria-label="New records">
    <mat-icon>notifications</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item *ngFor="let entry of entries" (click)="open(entry)">
      <span>{{ entry.count }} new {{ entry.label }}</span>
    </button>
    <button mat-menu-item disabled *ngIf="entries.length === 0">Nothing new</button>
  </mat-menu>
</ng-container>
