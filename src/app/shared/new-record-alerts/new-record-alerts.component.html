@if (entries$ | async; as entries) {
  <button
    mat-icon-button
    [matMenuTriggerFor]="menu"
    [matBadge]="total$ | async"
    matBadgeColor="warn"
    [matBadgeHidden]="entries.length === 0"
    aria-label="New records">
    <mat-icon>notifications</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    @for (entry of entries; track entry) {
      <button mat-menu-item (click)="open(entry)">
        <span>{{ entry.count }} new {{ entry.label }}</span>
      </button>
    }
    @if (entries.length === 0) {
      <button mat-menu-item disabled>Nothing new</button>
    }
  </mat-menu>
}
