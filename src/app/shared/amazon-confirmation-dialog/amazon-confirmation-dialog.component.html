<app-popup-header title="SEND SHIPPING CONFIRMATION" [showCloseButton]="true" (closed)="onCancel()"></app-popup-header>

<mat-dialog-content class="amazon-dialog">
  <p class="amazon-dialog__text">
    Emails <b>{{ data.item.email }}</b> that their order shipped via Amazon
    (using the "Amazon Shipping Confirmation" email template) and closes the order.
  </p>

  <mat-form-field appearance="outline" class="amazon-dialog__tracking">
    <mat-label>Amazon tracking number or link (optional)</mat-label>
    <input matInput [(ngModel)]="tracking" placeholder="e.g. TBA123456789">
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <app-indicator-button title="SEND & CLOSE ORDER" [isInProgress]="sending" (clicked)="send()"></app-indicator-button>
</mat-dialog-actions>
