<div class="tree-node" [style.padding-left.px]="depth * 16">
  <button
    mat-icon-button
    class="tree-node__toggle"
    type="button"
    (click)="toggle($event)">
    @if (loading) {
      <mat-spinner diameter="14"></mat-spinner>
    }
    @if (!loading) {
      <mat-icon>{{ expanded ? 'arrow_drop_down' : 'arrow_right' }}</mat-icon>
    }
  </button>
  <div
    class="tree-node__label"
    [class.tree-node__label--selected]="folderPath === selectedPath"
    role="button"
    tabindex="0"
    (click)="select()"
    (keydown.enter)="select()">
    <mat-icon class="tree-node__icon">folder</mat-icon>
    <span class="tree-node__name">{{ folderName }}</span>
  </div>
</div>

@if (expanded) {
  <div class="tree-node__children">
    @for (child of children; track child) {
      <app-file-tree-node
        [folderPath]="childPath(child)"
        [folderName]="child.name"
        [depth]="depth + 1"
        [selectedPath]="selectedPath"
        [refreshToken]="refreshToken"
        (folderSelected)="onChildSelected($event)">
      </app-file-tree-node>
    }
  </div>
}
