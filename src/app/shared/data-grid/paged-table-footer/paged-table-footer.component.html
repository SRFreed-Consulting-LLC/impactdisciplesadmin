<div class="paged-table-footer">
  <ng-container *ngIf="loadingMore">
    <mat-spinner diameter="16"></mat-spinner>
    <span>Loading more&hellip;</span>
  </ng-container>

  <ng-container *ngIf="!loadingMore && hasMore">
    <span>{{ loadedCount }} loaded &mdash; scroll for more</span>
  </ng-container>

  <ng-container *ngIf="!loadingMore && !hasMore">
    <span>{{ loadedCount }} loaded &mdash; that's all of them</span>
  </ng-container>
</div>
