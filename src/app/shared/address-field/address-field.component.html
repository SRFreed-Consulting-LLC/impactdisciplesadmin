<div class="address-field" [formGroup]="group">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Address 1</mat-label>
    <input matInput formControlName="address1">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Address 2</mat-label>
    <input matInput formControlName="address2">
  </mat-form-field>

  <div class="row">
    <mat-form-field appearance="outline" class="city-field">
      <mat-label>City</mat-label>
      <input matInput formControlName="city">
    </mat-form-field>

    <mat-form-field appearance="outline" class="state-field">
      <mat-label>State</mat-label>
      <mat-select formControlName="state">
        <mat-option *ngFor="let state of states" [value]="state">{{ state }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="zip-field">
      <mat-label>Zip</mat-label>
      <input matInput formControlName="zip">
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full-width" *ngIf="showCountry">
    <mat-label>Country</mat-label>
    <mat-select formControlName="country">
      <mat-option *ngFor="let country of countries" [value]="country">{{ country }}</mat-option>
    </mat-select>
  </mat-form-field>
</div>
