<button mat-stroked-button type="button" class="variable-inserter-trigger" [matMenuTriggerFor]="menu" [disabled]="!variables.length">
  <mat-icon>data_object</mat-icon>
  Insert Variable
</button>
<mat-menu #menu="matMenu">
  @for (variable of variables; track variable) {
    <button mat-menu-item (click)="insert.emit(variable)">
      {{ variable }}
    </button>
  }
</mat-menu>
