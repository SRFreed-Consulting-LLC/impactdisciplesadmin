<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p [innerHTML]="data.message"></p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">CANCEL</button>
  <button mat-raised-button color="primary" (click)="onConfirm()" cdkFocusInitial>OK</button>
</mat-dialog-actions>
