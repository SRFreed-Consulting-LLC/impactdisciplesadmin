<div class="form-renderer" [class.form-renderer--preview]="mode === 'preview'" [style.background-color]="backgroundColor || null">
  <ng-container *ngFor="let field of fields">
    <app-form-renderer-field [field]="field" [form]="form" [mode]="mode"></app-form-renderer-field>
  </ng-container>

  <div *ngIf="!fields.length" class="form-renderer__empty">Drag a field onto the canvas to see it here.</div>

  <button *ngIf="mode === 'fill'" mat-flat-button color="primary" type="button" class="form-renderer__submit" (click)="submit()">
    Submit
  </button>
</div>
