@if (mode === 'list') {
  <app-data-grid
    [showColumnsButton]="false"
    [showExportButton]="false"
    [title]="itemType + 's'"
    [headerActions]="headerActions"
    [columns]="columns"
    [rowActions]="rowActions"
    [rows]="(items$ | async) ?? []"
    [loading]="(loading$ | async) ?? false"
    tableClass="organizations-table"
    initialSortKey="name"
    initialSortDirection="asc"
    emptyMessage="No organizations found."
    exportFileName="organizations.xlsx"
    (rowDoubleClick)="showEditModal($event)">
    <ng-template appDataGridCell="phone" let-row>
      {{ row.phone?.countryCode ? '+' + row.phone.countryCode : '' }} {{ row.phone ? (row.phone | phoneNumberMask: false) : '' }}
    </ng-template>
  </app-data-grid>
}

@if (mode === 'edit') {
  <app-organization-details [item]="editingItem" (closed)="onEditClosed()"></app-organization-details>
}
