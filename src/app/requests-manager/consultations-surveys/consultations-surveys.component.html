<app-data-grid
  [title]="itemType + 's'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(surveys$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  [rowClass]="rowClass"
  tableClass="surveys-table"
  initialSortKey="date"
  initialSortDirection="desc"
  exportFileName="consultation_surveys.xlsx"
  (rowDoubleClick)="showEditModal($event)">
  <ng-template appDataGridCell="phone" let-row>
    {{ row.phone?.countryCode ? '+' + row.phone.countryCode : '' }} {{ row.phone ? (row.phone | phoneNumberMask: false) : '' }}
  </ng-template>
</app-data-grid>
