<app-list-header [title]="itemType + 's'" [actions]="actions">
  <button mat-raised-button color="primary" type="button" class="columns-button" [matMenuTriggerFor]="columnsMenu">
    <mat-icon>view_column</mat-icon>
    Columns
  </button>
  <mat-menu #columnsMenu="matMenu">
    <button mat-menu-item *ngFor="let column of columns" (click)="$event.stopPropagation(); toggleColumn(column)">
      <mat-checkbox [checked]="column.visible" (click)="$event.stopPropagation(); toggleColumn(column)">{{ column.label }}</mat-checkbox>
    </button>
  </mat-menu>

  <button mat-raised-button color="primary" type="button" (click)="exportExcel()">
    <mat-icon>file_download</mat-icon>
    Export to Excel
  </button>
</app-list-header>

<div class="table-scroll">
<app-table-loading-overlay [loading]="loading$ | async"></app-table-loading-overlay>
<table mat-table [dataSource]="(surveys$ | async) ?? []" class="surveys-table">
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let item">{{ item.date | date }}</td>
  </ng-container>

  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef>Last Name</th>
    <td mat-cell *matCellDef="let item">{{ item.lastName }}</td>
  </ng-container>

  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef>First Name</th>
    <td mat-cell *matCellDef="let item">{{ item.firstName }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let item">{{ item.email }}</td>
  </ng-container>

  <ng-container matColumnDef="churchName">
    <th mat-header-cell *matHeaderCellDef>Church Name</th>
    <td mat-cell *matCellDef="let item">{{ item.churchName }}</td>
  </ng-container>

  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Number</th>
    <td mat-cell *matCellDef="let item">
      {{ item.phone?.countryCode ? '+' + item.phone.countryCode : '' }} {{ item.phone ? (item.phone | phoneNumberMask: false) : '' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
    <td mat-cell *matCellDef="let item" class="actions-column">
      <button mat-icon-button matTooltip="DELETE" (click)="delete(item)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <!-- Filter row: one operator+value filter per filterable column, mirroring dxo-filter-row -->
  <ng-container matColumnDef="date-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="dateOperators" type="date" (filterChange)="onFilterChange('date', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="lastName-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('lastName', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="firstName-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('firstName', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="email-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('email', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="churchName-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('churchName', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="phone-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('phone', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="actions-filter">
    <th mat-header-cell *matHeaderCellDef></th>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-header-row *matHeaderRowDef="filterColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.row--new]="tracker.newIds.has(row.id)" (dblclick)="showEditModal(row)"></tr>
</table>
</div>
