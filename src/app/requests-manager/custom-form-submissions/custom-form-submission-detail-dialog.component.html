<app-popup-header [title]="'SUBMISSION: ' + data.item.formName" [showCloseButton]="true" (closed)="onClose()">
  <span class="test-chip" popup-header-actions *ngIf="data.item.isTest">TEST</span>
</app-popup-header>

<mat-dialog-content>
  <div class="submitted-at">Submitted {{ data.item.submittedAt | date: 'MMM d, y, h:mm a' }}</div>

  <dl class="detail-list">
    <ng-container *ngFor="let row of rows">
      <dt>{{ row.label }}</dt>
      <dd>{{ row.value }}</dd>
    </ng-container>
  </dl>

  <div *ngIf="!rows.length" class="no-fields">This form had no data fields.</div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onClose()">CLOSE</button>
</mat-dialog-actions>
