<app-data-grid
  [title]="itemType + 's'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(requests$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  [rowClass]="rowClass"
  tableClass="requests-table"
  initialSortKey="date"
  initialSortDirection="desc"
  exportFileName="lunch_and_learns.xlsx"
  (rowDoubleClick)="showEditModal($event)">
</app-data-grid>
