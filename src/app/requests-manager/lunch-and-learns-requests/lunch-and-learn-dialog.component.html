<app-popup-header [title]="(isEdit ? 'EDIT' : 'ADD') + ' LUNCH AND LEARN REQUEST'" [showCloseButton]="true" (closed)="onCancel()"></app-popup-header>

<mat-dialog-content [formGroup]="form">
  <div class="field-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="firstName" required>
      <mat-error *ngIf="form.get('firstName')?.hasError('required')">First name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName" required>
      <mat-error *ngIf="form.get('lastName')?.hasError('required')">Last name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" required>
      <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
    </mat-form-field>
  </div>

  <h3 class="section-title">Information</h3>
  <div class="field-row">
    <mat-form-field appearance="outline" class="third-width">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="datePicker" formControlName="requestedDate" required>
      <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
      <mat-datepicker #datePicker></mat-datepicker>
      <mat-error *ngIf="form.get('requestedDate')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="third-width">
      <mat-label>Start Time</mat-label>
      <input matInput type="time" formControlName="requestedStartTime" required>
      <mat-error *ngIf="form.get('requestedStartTime')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="third-width">
      <mat-label>End Time</mat-label>
      <input matInput type="time" formControlName="requestedEndTime" required>
      <mat-error *ngIf="form.get('requestedEndTime')?.hasError('required')">Required</mat-error>
    </mat-form-field>
  </div>

  <h3 class="section-title">Address</h3>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Location Name</mat-label>
    <input matInput formControlName="locationName">
  </mat-form-field>
  <app-address-field [group]="$any(form.get('locationAddress'))"></app-address-field>

  <h3 class="section-title">Contact Information</h3>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Coordinator</mat-label>
    <input matInput formControlName="coordinator" required>
    <mat-error *ngIf="form.get('coordinator')?.hasError('required')">Coordinator is required</mat-error>
  </mat-form-field>
  <app-phone-field [group]="$any(form.get('coordinatorPhone'))"></app-phone-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="inProgress$ | async" (click)="onCancel()">CANCEL</button>
  <app-indicator-button
    title="SAVE"
    [isInProgress]="inProgress$ | async"
    [disabled]="inProgress$ | async"
    (onClick)="onSave()">
  </app-indicator-button>
</mat-dialog-actions>
