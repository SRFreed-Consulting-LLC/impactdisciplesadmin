<app-auth-card title="Change Password">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="auth-form__field">
      <input
        class="auth-form__input"
        type="password"
        formControlName="password"
        placeholder="Password"
        [disabled]="isLoading">
      <span class="auth-form__invalid-badge" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">!</span>
    </div>

    <div class="auth-form__field">
      <input
        class="auth-form__input"
        type="password"
        formControlName="confirmedPassword"
        placeholder="Confirm Password"
        [disabled]="isLoading">
      <span class="auth-form__invalid-badge" *ngIf="form.get('confirmedPassword')?.invalid && form.get('confirmedPassword')?.touched">!</span>
    </div>

    <button type="submit" class="auth-form__submit" [disabled]="isLoading">
      <mat-progress-spinner *ngIf="isLoading; else notLoading" diameter="24" mode="indeterminate"></mat-progress-spinner>
      <ng-template #notLoading>Continue</ng-template>
    </button>
  </form>
</app-auth-card>
