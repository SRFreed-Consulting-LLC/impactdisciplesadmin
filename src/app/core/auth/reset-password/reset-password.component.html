<app-auth-card
  title="Reset Password"
  description="Please enter the email address that you used to register, and we will send you a link to reset your password via Email.">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="auth-form__field">
      <input
        class="auth-form__input"
        type="email"
        formControlName="email"
        placeholder="Email"
        [disabled]="isLoading">
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="auth-form__invalid-badge">!</span>
        }
      </div>

      <button type="submit" class="auth-form__submit" [disabled]="isLoading">
        @if (isLoading) {
          <mat-progress-spinner diameter="24" mode="indeterminate"></mat-progress-spinner>
        } @else {
          Reset my password
        }
      </button>

      <div class="auth-form__link">
        Return to <a routerLink="/login" class="auth-form__link--accent">Sign In</a>
      </div>
    </form>
  </app-auth-card>
