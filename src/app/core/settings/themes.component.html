<app-list-header title="Settings"></app-list-header>

<div class="settings-content">
  <mat-card class="settings-card">
    <mat-card-header>
      <mat-card-title>Appearance</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="field">
        <span class="field-label">Dark Mode</span>
        <mat-slide-toggle
          [checked]="themeService.darkMode()"
          (change)="onDarkModeChange($event)"
          aria-label="Toggle dark mode">
        </mat-slide-toggle>
      </div>

      <div class="field field--column">
        <span class="field-label">Color Theme</span>
        <div class="accent-options">
          <button
            type="button"
            *ngFor="let option of colorThemes"
            class="accent-option"
            [class.accent-option--selected]="themeService.colorTheme() === option.id"
            (click)="onColorThemeChange(option.id)">
            <span class="theme-swatch" [ngClass]="swatchClasses(option.id)">
              <span class="theme-swatch-primary"></span>
              <span class="theme-swatch-tertiary"></span>
            </span>
            <span>{{ option.label }}</span>
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
