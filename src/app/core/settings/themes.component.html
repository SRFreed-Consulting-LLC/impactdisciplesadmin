<app-list-header title="Settings"></app-list-header>

<div class="settings-content">
  <!-- The one place a member of staff can change something on their OWN
  admin_users record. Above Appearance because it is about who you are
  rather than how the app looks. -->
  <app-profile-card></app-profile-card>

  <mat-card class="settings-card">
    <mat-card-header>
      <mat-card-title>Appearance</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="field field--column">
        <span class="field-label">Theme</span>
        <div class="accent-options">
          @for (option of colorThemes; track option) {
            <button
              type="button"
              class="accent-option"
              [class.accent-option--selected]="themeService.colorTheme() === option.id"
              (click)="onColorThemeChange(option.id)">
              <span class="theme-swatch" [ngClass]="swatchClasses(option.id)">
                <span class="theme-swatch-ground"></span>
                <span class="theme-swatch-card"></span>
                <span class="theme-swatch-accent"></span>
              </span>
              <span>{{ option.label }}</span>
            </button>
          }
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
