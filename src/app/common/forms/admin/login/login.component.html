<div class="login-page">
  <mat-card class="login-card">
    <div class="login-header">
      <app-animated-logo></app-animated-logo>
      <h1 class="login-title">Impact Disciples Admin</h1>
    </div>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" [disabled]="isLoading">
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" [disabled]="isLoading">
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">Password must be at least 6 characters</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="isLoading">
          <mat-progress-spinner *ngIf="isLoading; else notLoading" diameter="20" mode="indeterminate"></mat-progress-spinner>
          <ng-template #notLoading>Sign In</ng-template>
        </button>

        <div class="login-form__link">
          <a routerLink="/reset-password">Forgot password?</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
