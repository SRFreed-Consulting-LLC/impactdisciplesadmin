<app-data-grid
  [title]="itemType + 's'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(subscribers$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  [selection]="selection"
  tableClass="subscribers-table"
  initialSortKey="lastName"
  initialSortDirection="asc"
  exportFileName="prayer_team_subscribers.xlsx"
  (rowDoubleClick)="showEditModal($event)"
  (visibleRowsChange)="onVisibleRowsChange($event)">
  <mat-form-field dataGridHeaderExtra appearance="outline" subscriptSizing="dynamic" class="list-filter">
    <mat-label>Filter by List</mat-label>
    <mat-select [value]="selectedList?.id ?? null" (selectionChange)="onListFilterChanged($event.value)">
      <mat-option [value]="null">(All Subscribers)</mat-option>
      <mat-option *ngFor="let list of emailLists" [value]="list.id">{{ list.name }}</mat-option>
    </mat-select>
  </mat-form-field>
</app-data-grid>
