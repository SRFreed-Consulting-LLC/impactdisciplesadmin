<!-- Shared <app-data-grid> since 2026-08-21 (bucket A item #1). Replaced a
     hand-rolled mat-table plus its own header row, loading spinner and
     empty state - all of which the grid provides - and the screen gains
     column filtering, sorting, the columns picker and Excel export for
     free, exactly as every other list screen in this app already has. -->
<app-data-grid
  title="Lesson Templates"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="lessonTemplates"
  [loading]="loading"
  emptyMessage="No lesson templates yet."
  tableClass="templates-table"
  initialSortKey="title"
  initialSortDirection="asc"
  (rowDoubleClick)="openLessonTemplate($event)">
</app-data-grid>
