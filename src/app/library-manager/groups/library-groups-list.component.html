<!-- Shared <app-data-grid> since 2026-08-21 (bucket A item #1). Replaced a
     hand-rolled mat-table plus its own search box and type/status/visibility
     dropdowns, spinner and empty state. Filtering is the grid's per-column
     filter row now, matching every other list in this app. -->
<app-data-grid
  title="Impact Groups"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="visibleRows()"
  [loading]="loading()"
  emptyMessage="No Impact Groups yet."
  tableClass="groups-table"
  exportFileName="impact-groups.xlsx"
  exportWorksheetName="Impact Groups"
  initialSortKey="title"
  initialSortDirection="asc"
  (rowDoubleClick)="openEditDialog($event.group)">
</app-data-grid>
