<!-- Shared <app-data-grid> since 2026-08-21 (bucket A item #1). Replaced a
     hand-rolled mat-table plus its own search box, checkbox column, spinner,
     "Load more" buttons and a duplicated copy of InfiniteScrollDirective.
     In PAGED mode the grid owns loading, infinite scroll and the footer, so
     this screen just hands it the source; the checkbox column comes from
     [selection], and filtering is the grid's own per-column filter row -
     the same way an admin filters every other list in this app. -->
<app-data-grid
  title="Library Users"
  [headerActions]="headerActions"
  [columns]="columns"
  [pagedSource]="paged"
  [selection]="selection"
  emptyMessage="No library users yet."
  tableClass="users-table"
  exportFileName="library-users.xlsx"
  exportWorksheetName="Library Users"
  (rowDoubleClick)="openDetail($event)">
</app-data-grid>
