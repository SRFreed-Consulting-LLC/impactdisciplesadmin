<!-- Shared <app-data-grid> since 2026-08-21 (bucket A item #1). Read-only
     history: no header action and no row actions - sent announcements
     cannot be edited or recalled, each recipient already holds their own
     inbox copy. Opening a row shows the full message. -->
<app-data-grid
  title="Sent Announcements"
  [columns]="columns"
  [rows]="messages()"
  [loading]="loading()"
  emptyMessage="No announcements have been sent yet."
  tableClass="messages-table"
  initialSortKey="sentAt"
  initialSortDirection="desc"
  (rowDoubleClick)="openDetail($event)">
</app-data-grid>
