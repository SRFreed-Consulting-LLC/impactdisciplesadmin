<!-- Shared <app-data-grid> since 2026-08-21 (bucket A item #1). Replaced a
     hand-rolled mat-table plus its own search box, actor/action dropdowns,
     checkbox column, spinner and empty state. Filtering is now the grid's
     per-column filter row - the same way an admin filters every other list
     in this app - so the actor and action dropdowns are gone in favour of
     typing in those columns. Selection comes from [selection]. -->
<app-data-grid
  title="Activity Log"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="rows()"
  [loading]="loading()"
  [selection]="selection"
  emptyMessage="No activity recorded yet."
  tableClass="activity-table"
  exportFileName="library-activity-log.xlsx"
  exportWorksheetName="Activity Log"
  initialSortKey="timestamp"
  initialSortDirection="desc">
</app-data-grid>
