<div class="subtemplates-header">
  <h3>Subtemplates</h3>
  <button mat-flat-button color="primary" (click)="createSubtemplate()">
    <mat-icon>post_add</mat-icon>
    New Subtemplate
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
} @else if (subtemplates.length === 0) {
  <p class="empty-state">No subtemplates yet.</p>
} @else {
  <div class="table-scroll">
    <table
      mat-table
      [dataSource]="subtemplates"
      [trackBy]="trackBySubtemplateId"
      class="subtemplates-table"
    >
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let subtemplate">{{ subtemplate.title }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let subtemplate">{{ typeLabel(subtemplate.type) }}</td>
      </ng-container>

      <ng-container matColumnDef="fieldCount">
        <th mat-header-cell *matHeaderCellDef>Fields</th>
        <td mat-cell *matCellDef="let subtemplate">{{ fieldCount(subtemplate) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let subtemplate" class="actions-cell">
          <button
            mat-icon-button
            matTooltip="Delete"
            (click)="deleteSubtemplate(subtemplate, $event)"
          >
            <mat-icon>delete_outline</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="subtemplate-row"
        tabindex="0"
        (click)="openSubtemplate(row)"
        (keydown.enter)="openSubtemplate(row)"
      ></tr>
    </table>
  </div>
}
