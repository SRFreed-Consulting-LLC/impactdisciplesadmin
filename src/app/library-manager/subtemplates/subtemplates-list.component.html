<!-- Shared <app-data-grid> since 2026-08-21 (bucket A item #1) - replaced a
     hand-rolled mat-table with its own header, spinner and empty state, and
     gains filtering/sorting/columns/export. See lesson-templates-list. -->
<app-data-grid
  title="Subtemplates"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="subtemplates"
  [loading]="loading"
  emptyMessage="No subtemplates yet."
  tableClass="subtemplates-table"
  initialSortKey="title"
  initialSortDirection="asc"
  (rowDoubleClick)="openSubtemplate($event)">
</app-data-grid>
