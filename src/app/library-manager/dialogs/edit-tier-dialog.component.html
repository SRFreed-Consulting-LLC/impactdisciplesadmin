<h2 mat-dialog-title>{{ isEditMode ? 'Edit Discount Tier' : 'New Discount Tier' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <div mat-dialog-content>
    <mat-form-field appearance="outline" style="width: 100%">
      <mat-label>Number of books</mat-label>
      <input matInput type="number" min="1" formControlName="numberOfBooks" cdkFocusInitial />
      @if (form.controls.numberOfBooks.hasError('min')) {
        <mat-error>Enter at least 1</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%">
      <mat-label>Percent off</mat-label>
      <input matInput type="number" min="1" max="100" formControlName="percentOff" />
      @if (form.controls.percentOff.hasError('min') || form.controls.percentOff.hasError('max')) {
        <mat-error>Enter a percent between 1 and 100</mat-error>
      }
    </mat-form-field>
  </div>
  <div mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">
      {{ isEditMode ? 'Save' : 'Create' }}
    </button>
  </div>
</form>
