<h2 mat-dialog-title>Send message</h2>
<mat-dialog-content>
  <p class="recipient-summary">
    To: <strong>{{ data.recipientLabel }}</strong>
  </p>
  <p class="delivery-note">
    Delivered as a device notification and saved to each user's Messages inbox in the reader app.
  </p>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Title</mat-label>
    <input matInput [(ngModel)]="title" [maxlength]="titleMax" [disabled]="sending()" />
    <mat-hint align="end">{{ title.length }}/{{ titleMax }}</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Message</mat-label>
    <textarea
      matInput
      rows="6"
      [(ngModel)]="body"
      [maxlength]="bodyMax"
      [disabled]="sending()"
    ></textarea>
    <mat-hint align="end">{{ body.length }}/{{ bodyMax }}</mat-hint>
  </mat-form-field>

  @if (error(); as message) {
    <p class="error-message">{{ message }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="sending()">Cancel</button>
  <button mat-flat-button color="primary" (click)="send()" [disabled]="!canSend()">
    @if (sending()) {
      <mat-spinner diameter="18" class="button-spinner"></mat-spinner>
    }
    Send
  </button>
</mat-dialog-actions>
