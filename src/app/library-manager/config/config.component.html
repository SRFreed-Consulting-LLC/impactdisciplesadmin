<h3 class="config-title">Config</h3>

<p class="hint">
  When a group leader pre-purchases licenses for their Impact Group, the highest tier at or below
  the quantity they buy applies - e.g. tiers of 5 books/10% and 10 books/20% mean buying 7 gets 10%
  off, buying 12 gets 20% off. Buying fewer than the lowest tier gets no discount.
</p>

<!-- Shared <app-data-grid> since 2026-08-21 (bucket A item #1). The
     explanatory hint above stays put - the grid replaces only the table,
     its header row, spinner and empty state. -->
<app-data-grid
  title="Bulk purchase discount tiers"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="tiers"
  [loading]="loading"
  emptyMessage="No discount tiers yet - purchases get no discount until you add one."
  tableClass="tiers-table"
  initialSortKey="numberOfBooks"
  initialSortDirection="asc"
  (rowDoubleClick)="openEditDialog($event)">
</app-data-grid>
