@if (mode === 'list') {
  @if (liveCampaigns.length) {
    <div class="hub">
      <div class="hub__label">Live Now · {{ liveCampaigns.length }}</div>
      <div class="hub__cards">
        @for (campaign of liveCampaigns; track campaign.id) {
          <button type="button" class="hub-card" (click)="showEdit(campaign)">
            <div class="hub-card__name">
              <span class="hub-card__title">{{ campaign.name }}</span>
              <span class="chip" [class]="'type-' + campaign.type">{{ typeLabels[campaign.type] }}</span>
            </div>
            @if (targetName(campaign)) {
              <div class="hub-card__target">{{ targetName(campaign) }}</div>
            }
            <div class="hub-card__stats">
              @for (stat of hubStats(campaign); track stat.label) {
                <div class="stat">
                  <div class="stat__value">{{ stat.value }}</div>
                  <div class="stat__label">{{ stat.label }}</div>
                </div>
              }
            </div>
          </button>
        }
      </div>
    </div>
  }
  <app-data-grid
    [title]="itemType + 's'"
    [headerActions]="headerActions"
    [columns]="columns"
    [rowActions]="rowActions"
    [pagedSource]="paged"
    tableClass="campaigns-table"
    exportFileName="campaigns.xlsx"
    (rowDoubleClick)="showEdit($event)">
    <ng-template appDataGridCell="type" let-row>
      <span class="chip" [class]="'type-' + row.type">{{ typeLabels[row.type] }}</span>
    </ng-template>
    <ng-template appDataGridCell="status" let-row>
      <span class="chip" [class]="'status-' + effectiveStatus(row)">{{ effectiveStatus(row) | uppercase }}</span>
    </ng-template>
  </app-data-grid>
}

@if (mode === 'gallery') {
  <app-template-gallery (picked)="onTemplatePicked($event)" (cancelled)="mode = 'list'"></app-template-gallery>
}

@if (mode === 'edit') {
  <app-campaign-composer [campaign]="editingCampaign" [template]="pendingTemplate" (closed)="onComposerClosed($event)"></app-campaign-composer>
}
