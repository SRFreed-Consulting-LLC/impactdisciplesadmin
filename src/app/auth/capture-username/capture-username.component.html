<app-auth-card title="Sign In">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="auth-form__intro">Please enter your User Name</div>

    <div class="auth-form__field">
      <input
        class="auth-form__input"
        type="email"
        formControlName="email"
        placeholder="Email"
        [disabled]="isLoading">
      <span class="auth-form__invalid-badge" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">!</span>
    </div>

    <button type="submit" class="auth-form__submit" [disabled]="isLoading">
      <mat-progress-spinner *ngIf="isLoading; else notLoading" diameter="24" mode="indeterminate"></mat-progress-spinner>
      <ng-template #notLoading>Find User Account</ng-template>
    </button>
  </form>
</app-auth-card>
