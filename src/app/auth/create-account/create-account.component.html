<app-auth-card title="Sign Up">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="auth-form__intro">In order to create your account, we need to know your email and password. Please enter your email and password.</div>

    <div class="auth-form__field">
      <input
        class="auth-form__input"
        type="email"
        formControlName="email"
        placeholder="Email"
        [disabled]="isLoading">
      <span class="auth-form__invalid-badge" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">!</span>
    </div>

    <div class="auth-form__field">
      <input
        class="auth-form__input"
        type="password"
        formControlName="password"
        placeholder="Password"
        [disabled]="isLoading">
      <span class="auth-form__invalid-badge" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">!</span>
    </div>

    <div class="auth-form__field">
      <input
        class="auth-form__input"
        type="password"
        formControlName="password2"
        placeholder="Retype Password"
        [disabled]="isLoading">
      <span class="auth-form__invalid-badge" *ngIf="form.get('password2')?.invalid && form.get('password2')?.touched">!</span>
    </div>

    <button type="submit" class="auth-form__submit" [disabled]="isLoading">
      <mat-progress-spinner *ngIf="isLoading; else notLoading" diameter="24" mode="indeterminate"></mat-progress-spinner>
      <ng-template #notLoading>Create Account</ng-template>
    </button>
  </form>
</app-auth-card>
