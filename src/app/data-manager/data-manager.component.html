<div class="manager-content">
  <!-- The records the public site is built out of. Each of these was in a
       different manager until 2026-08-30 - see data-manager.component.ts for
       what they have in common and what the move cost. -->
  @if (selectedTab === 'Products') {
    <app-products></app-products>
  }

  @if (selectedTab === 'Testimonials') {
    <app-testimonials></app-testimonials>
  }

  @if (selectedTab === 'Team Page') {
    <app-team-page></app-team-page>
  }

  <!-- Came from Page Manager on 2026-08-31, for the same reason Testimonials
       and Team Page did the day before: it is a list of records the site
       renders, not the content of any one page. -->
  @if (selectedTab === 'Disciple Making Minute') {
    <app-dmms></app-dmms>
  }

  @if (selectedTab === 'Form Submissions') {
    <app-custom-form-submissions></app-custom-form-submissions>
  }

  @if (selectedTab === 'Form Builder') {
    <app-form-builder></app-form-builder>
  }

  <!-- Came from Page Manager on 2026-08-31. The odd one out in this group -
       everything else here is a list of records and this is settings - but
       it is site-wide either way, and it was the last thing in Page Manager
       that was not a page. It hosts the DOCKING BAR too: that strip renders
       on every page of the site, so it is furniture rather than content. -->
  @if (selectedTab === 'Web Config') {
    <app-web-config></app-web-config>
  }
</div>
