<div class="report-content">
  @if (errorMessage()) {
    <div class="error-state">{{ errorMessage() }}</div>
  }

  <app-data-grid
    title="Contacts"
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [headerActions]="[]"
    emptyMessage="No contacts found."
    tableClass="report-table"
    exportFileName="contact-report.xlsx"
    exportWorksheetName="Contacts"
    initialSortKey="lastName"
    initialSortDirection="asc">
  </app-data-grid>

  @if (!loading() && !errorMessage()) {
    <div class="result-count">
      {{ totalCount() | number }} contact{{ totalCount() === 1 ? '' : 's' }}
    </div>
  }
</div>
