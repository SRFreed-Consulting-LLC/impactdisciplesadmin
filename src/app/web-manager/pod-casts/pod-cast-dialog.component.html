<app-popup-header [formGroup]="form" [title]="(isEdit ? 'EDIT' : 'ADD') + ' POD CAST'" [showCloseButton]="true" (closed)="onCancel()">
  <mat-slide-toggle popup-header-actions formControlName="isActive">Live</mat-slide-toggle>
</app-popup-header>

<mat-dialog-content [formGroup]="form">
  <div class="field-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="datePicker" formControlName="date" required>
      <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
      <mat-datepicker #datePicker></mat-datepicker>
      <mat-error *ngIf="form.get('date')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category" required>
        <mat-option *ngFor="let category of data.categories" [value]="category.id">{{ category.tag }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('category')?.hasError('required')">Category is required</mat-error>
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Title</mat-label>
    <input matInput formControlName="title" required>
    <mat-error *ngIf="form.get('title')?.hasError('required')">Title is required</mat-error>
  </mat-form-field>

  <div class="field-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Image Name</mat-label>
      <input matInput [value]="card.thumbnail?.name ?? ''" readonly>
    </mat-form-field>
    <button mat-stroked-button type="button" [disabled]="inProgress$ | async" (click)="showImageUploader()">Upload Main Image</button>
  </div>

  <div class="field-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Video Type</mat-label>
      <mat-select formControlName="videoType" required>
        <mat-option *ngFor="let type of videoTypes" [value]="type">{{ type }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('videoType')?.hasError('required')">Video type is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Video Id</mat-label>
      <input matInput formControlName="videoId" required>
      <mat-error *ngIf="form.get('videoId')?.hasError('required')">Video ID is required</mat-error>
    </mat-form-field>
  </div>

  <app-tag-chips formControlName="tags" [options]="podCastTags" placeholder="Tag this Pod Cast..." (createTag)="onCreateTag($event)"></app-tag-chips>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="inProgress$ | async" (click)="onCancel()">CANCEL</button>
  <app-indicator-button
    title="SAVE"
    [isInProgress]="inProgress$ | async"
    [disabled]="inProgress$ | async"
    (onClick)="onSave()">
  </app-indicator-button>
</mat-dialog-actions>

<ng-container *ngIf="isImageUploaderVisible$ | async">
  <app-image-uploader
    [card]="card"
    [isList]="false"
    [field]="'thumbnail'"
    [selectionMode]="'single'"
    [imageSelectVisible]="isImageUploaderVisible$ | async"
    (imageSelectClosed)="closeImageUploader()">
  </app-image-uploader>
</ng-container>
