<app-data-grid
  [showColumnsButton]="false"
  [showExportButton]="false"
  [title]="itemType + 's'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(podCasts$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  tableClass="pod-casts-table"
  initialSortKey="date"
  initialSortDirection="desc"
  exportFileName="pod_casts.xlsx"
  (rowDoubleClick)="showEditModal($event)">
  <ng-template appDataGridCell="isActive" let-row>
    <span class="active-template" [style.background-color]="row.isActive ? '#29d029' : 'red'">
      {{ row.isActive ? 'LIVE' : 'INACTIVE' }}
    </span>
  </ng-template>
  <ng-template appDataGridCell="thumbnail" let-row>
    <img *ngIf="row.thumbnail" width="100" [src]="row.thumbnail.url" [alt]="row.thumbnail.name">
  </ng-template>
</app-data-grid>

<div class="sync-overlay" *ngIf="syncing$ | async">
  <mat-spinner diameter="56"></mat-spinner>
  <p>Please do not leave or refresh this page until complete!</p>
</div>
