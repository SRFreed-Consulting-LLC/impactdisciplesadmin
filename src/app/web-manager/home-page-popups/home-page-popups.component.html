<ng-container *ngIf="mode === 'list'">
  <app-data-grid
    [showColumnsButton]="false"
    [showExportButton]="false"
    [title]="itemType + 's'"
    [headerActions]="headerActions"
    [columns]="columns"
    [rowActions]="rowActions"
    [rows]="(popups$ | async) ?? []"
    [loading]="(loading$ | async) ?? false"
    tableClass="popups-table"
    exportFileName="home_page_popups.xlsx"
    (rowDoubleClick)="showEditModal($event)">
    <ng-template appDataGridCell="isActive" let-row>
      <span class="active-template" [style.background-color]="row.isActive ? '#29d029' : 'red'">
        {{ row.isActive ? 'LIVE' : 'INACTIVE' }}
      </span>
    </ng-template>
    <ng-template appDataGridCell="bgColor" let-row>
      <span class="color-swatch" [style.background-color]="row.bgColor"></span>
      {{ row.bgColor }}
    </ng-template>
  </app-data-grid>
</ng-container>

<ng-container *ngIf="mode === 'edit'">
  <div class="editor" [formGroup]="form">
    <mat-toolbar class="editor__header">
      <button mat-icon-button type="button" matTooltip="Back" [disabled]="inProgress$ | async" (click)="onCancel()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h2 class="editor__title">{{ (isEdit ? 'EDIT' : 'ADD') + ' HOME PAGE POPUP' }}</h2>
      <span class="editor__spacer"></span>
      <mat-slide-toggle formControlName="isActive">Live</mat-slide-toggle>
    </mat-toolbar>

    <div class="editor__body">
      <div class="editor__fields">
        <div class="field-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>From Date</mat-label>
            <input matInput type="datetime-local" formControlName="fromDate" required>
            <mat-error *ngIf="form.get('fromDate')?.hasError('required')">Required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>To Date</mat-label>
            <input matInput type="datetime-local" formControlName="toDate" required>
            <mat-error *ngIf="form.get('toDate')?.hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" required>
          <mat-error *ngIf="form.get('title')?.hasError('required')">Title is required</mat-error>
        </mat-form-field>

        <div class="field-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Popup Width (px)</mat-label>
            <input matInput type="number" formControlName="width" required>
            <mat-error *ngIf="form.get('width')?.hasError('required')">Required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Popup Height (px)</mat-label>
            <input matInput type="number" formControlName="height" required>
            <mat-error *ngIf="form.get('height')?.hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>

        <div class="color-row">
          <label class="color-row__label" for="bgColorSwatch">Background Color</label>
          <input id="bgColorSwatch" class="color-row__swatch" type="color" formControlName="bgColor">
          <mat-form-field appearance="outline" class="color-row__hex">
            <input matInput formControlName="bgColor" required>
          </mat-form-field>
        </div>

        <button mat-stroked-button type="button" [disabled]="inProgress$ | async" (click)="showPreview()">Preview</button>
      </div>

      <div class="editor__editor-wrap">
        <quill-editor formControlName="text" [modules]="richTextModules"></quill-editor>
      </div>
    </div>

    <div class="editor__actions">
      <button mat-button type="button" [disabled]="inProgress$ | async" (click)="onCancel()">CANCEL</button>
      <app-indicator-button
        title="SAVE"
        [isInProgress]="inProgress$ | async"
        [disabled]="inProgress$ | async"
        (clicked)="onSave()">
      </app-indicator-button>
    </div>
  </div>
</ng-container>
