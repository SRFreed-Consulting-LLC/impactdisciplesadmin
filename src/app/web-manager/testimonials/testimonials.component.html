<app-list-header [title]="itemType + 's'" [actions]="actions">
  <button mat-raised-button color="primary" type="button" class="columns-button" [matMenuTriggerFor]="columnsMenu">
    <mat-icon>view_column</mat-icon>
    Columns
  </button>
  <mat-menu #columnsMenu="matMenu">
    <button mat-menu-item *ngFor="let column of columns" (click)="$event.stopPropagation(); toggleColumn(column)">
      <mat-checkbox [checked]="column.visible" (click)="$event.stopPropagation(); toggleColumn(column)">{{ column.label }}</mat-checkbox>
    </button>
  </mat-menu>

  <button mat-raised-button color="primary" type="button" (click)="exportExcel()">
    <mat-icon>file_download</mat-icon>
    Export to Excel
  </button>
</app-list-header>

<div class="table-scroll">
<app-table-loading-overlay [loading]="loading$ | async"></app-table-loading-overlay>
<table mat-table [dataSource]="(testimonials$ | async) ?? []" class="testimonials-table">
  <ng-container matColumnDef="isActive">
    <th mat-header-cell *matHeaderCellDef>Live</th>
    <td mat-cell *matCellDef="let item">
      <span class="active-template" [style.background-color]="item.isActive ? '#29d029' : 'red'">
        {{ item.isActive ? 'LIVE' : 'INACTIVE' }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="author">
    <th mat-header-cell *matHeaderCellDef>Author</th>
    <td mat-cell *matCellDef="let item">{{ item.author }}</td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let item">{{ item.date | date }}</td>
  </ng-container>

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Title</th>
    <td mat-cell *matCellDef="let item">{{ item.title }}</td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Testimonial Type</th>
    <td mat-cell *matCellDef="let item">{{ item.type }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
    <td mat-cell *matCellDef="let item" class="actions-column">
      <button mat-icon-button matTooltip="DELETE" (click)="delete(item)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <!-- Filter row: one operator+value filter per filterable column, mirroring dxo-filter-row -->
  <ng-container matColumnDef="isActive-filter">
    <th mat-header-cell *matHeaderCellDef></th>
  </ng-container>

  <ng-container matColumnDef="author-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('author', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="date-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="dateOperators" type="date" (filterChange)="onFilterChange('date', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="title-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('title', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="type-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('type', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="actions-filter">
    <th mat-header-cell *matHeaderCellDef></th>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-header-row *matHeaderRowDef="filterColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="showEditModal(row)"></tr>
</table>
</div>
