<ng-container *ngIf="view=='edit'">
    <div class="mt-5 mb-5 text-center justify-content-around">
        <button class="btn btn-primary mr-3" id="edit-component-buttons" (click)="showPopup()">Configure Text Input</button>
    </div>
    <ng-container *ngIf="viewConfig">
        <dx-popup
            [width]="400"
            [height]="getScreenHeight()"
            [showTitle]="true"
            title="Configure Text Input"
            [dragEnabled]="true"
            [hideOnOutsideClick]="false"
            [(visible)]="viewConfig"
            [showCloseButton]="true">
            <dx-scroll-view [showScrollbar]="'always'" style="height:85%;">
                <div class="dx-field">
                    <div class="dx-field-label">Results Order</div>
                    <div class="dx-field-value">
                        <dx-text-box [(ngModel)]="input.result_order"></dx-text-box>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Required</div>
                    <div class="dx-field-value">
                        <dx-select-box [(ngModel)]="input.required" [items]="[true, false]"></dx-select-box>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Label</div>
                    <div class="dx-field-value">
                    <dx-text-box [(ngModel)]="input.text.label"></dx-text-box>
                    </div>
                </div>
                <div class="dx-field">
                    <div class="dx-field-label">Field Name</div>
                    <div class="dx-field-value">
                    <dx-text-box [(ngModel)]="input.text.field_name"></dx-text-box>
                    </div>
                </div>
                <div class="row d-flex mt-5 justify-content-around" style="margin: 0 auto;">
                    <div class="col-lg-6 text-center">
                      <dx-button width="100" stylingMode="contained" text="Save" type="default" (onClick)="viewConfig = false"></dx-button>
                    </div>
                    <div class="col-lg-6 text-center">
                      <dx-button width="100" stylingMode="contained" text="Cancel" type="default" (onClick)="resetForm()"></dx-button>
                    </div>
                </div>
            </dx-scroll-view>
        </dx-popup>
    </ng-container>
</ng-container>


<!--Text Display-->
<ng-container *ngIf="view == 'display' || view == 'preview'" >
    <ng-container *ngIf="form.position == 'top'">
        <label class="align-text-middle pt-2" for="{{input.text.label}}">{{input.text.label}}</label>
        <dx-text-box
            id="{{input.text.label}}"
            [(ngModel)]="formToSubmit[input.text.field_name]">
            <dx-validator *ngIf="input.required">
                <dxi-validation-rule
                  type="required"
                  message="Field is required">
                </dxi-validation-rule>
              </dx-validator>
        </dx-text-box>
    </ng-container>
    <ng-container *ngIf="form.position == 'left'">
        <label  style="float: left; width: 20%;" class="align-text-middle pt-2" for="{{input.text.label}}">{{input.text.label}}</label>
        <dx-text-box
            style="float: right; width: 80%;"
            id="{{input.text.label}}"
            [(ngModel)]="formToSubmit[input.text.field_name]"
            [required]="input.required">
            <dx-validator *ngIf="input.required">
                <dxi-validation-rule
                  type="required"
                  message="Field is required">
                </dxi-validation-rule>
              </dx-validator>
        </dx-text-box>
    </ng-container>
    <ng-container *ngIf="form.position == 'placeholder'">
        <dx-text-box
            placeholder="{{input.text.label}}"
            id="{{input.text.label}}"
            [(ngModel)]="formToSubmit[input.text.field_name]"
            [required]="input.required">
            <dx-validator *ngIf="input.required">
                <dxi-validation-rule
                  type="required"
                  message="Field is required">
                </dxi-validation-rule>
              </dx-validator>
        </dx-text-box>
    </ng-container>
</ng-container>
