<app-popup-header [formGroup]="form" [title]="(isEdit ? 'EDIT' : 'ADD') + ' DISCIPLE MAKING MINUTE'" [showCloseButton]="true" (closed)="onCancel()">
  <mat-slide-toggle popup-header-actions formControlName="isActive">Live</mat-slide-toggle>
</app-popup-header>

<mat-dialog-content [formGroup]="form">
 <div class="edit-with-preview">
  <div class="edit-with-preview__form">
  <div class="field-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="datePicker" formControlName="date" required>
      <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
      <mat-datepicker #datePicker></mat-datepicker>
      @if (form.get('date')?.hasError('required')) {
        <mat-error>Required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" required>
      @if (form.get('title')?.hasError('required')) {
        <mat-error>Title is required</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="editor-wrap">
    <quill-editor formControlName="text" [modules]="richTextModules"></quill-editor>
  </div>
  </div>

  <!-- Ported from the web repo's dmm-postbox-item: title, then the date in
       'MMMM d, y', then the body as rendered HTML. Same order and the same
       three fields, so what shows here is what the DMM page shows. -->
  <app-preview-rail storageKey="dmm" label="Public page" [width]="400">
    <div class="dmmp">
      <div class="dmmp__title">{{ form.value.title || 'Untitled' }}</div>
      <div class="dmmp__date">{{ form.value.date ? (form.value.date | date: 'MMMM d, y') : '' }}</div>
      <div class="dmmp__text" [innerHTML]="previewText"></div>
    </div>
  </app-preview-rail>
 </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="inProgress$ | async" (click)="onCancel()">CANCEL</button>
  <app-indicator-button
    title="SAVE"
    [isInProgress]="inProgress$ | async"
    [disabled]="inProgress$ | async"
    (clicked)="onSave()">
  </app-indicator-button>
</mat-dialog-actions>
