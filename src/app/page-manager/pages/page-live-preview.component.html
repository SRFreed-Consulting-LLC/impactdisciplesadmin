<!-- The real page, scaled down. Not a drawing of it - see the component.

     POINTER EVENTS ARE OFF on the frame, deliberately: a click inside it
     would navigate the preview somewhere else with no way back, and a scroll
     would fight the rail. Open in a new tab is the way in. -->
<div class="apv" #rail>
  <div class="apv-stage"
       [style.height.px]="scaledHeight"
       [style.width.px]="scaledWidth">
    <iframe
      #frame
      class="apv-frame"
      [class.apv-frame--loaded]="loaded"
      [src]="src"
      [style.width.px]="frameWidth"
      [style.height.px]="frameHeight"
      [style.transform]="'scale(' + scale + ')'"
      [title]="label + ' as a visitor sees it'"
      loading="lazy"
      referrerpolicy="no-referrer"
      (load)="onLoad()"
    ></iframe>

    <!-- The hovered section, outlined OVER the frame in this component's
         own pixels - the site says where it is, this draws it. See the
         component for why the site does not draw it itself. -->
    @if (highlightBox; as box) {
      <div class="apv-highlight" aria-hidden="true"
           [style.top.px]="box.top"
           [style.left.px]="box.left"
           [style.width.px]="box.width"
           [style.height.px]="box.height"></div>
    }

    @if (!loaded) {
      <p class="apv-loading">Loading {{ label }}&hellip;</p>
    }
  </div>

  <!-- Named so nobody debugs a stale deployed build thinking it is their own
       work - see the component's deploy-order note. -->
  <p class="apv-source">
    <a [href]="shownUrl" target="_blank" rel="noopener">{{ shownUrl }}</a>
  </p>
</div>
