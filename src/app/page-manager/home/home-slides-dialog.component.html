<h2 mat-dialog-title>Home Slider</h2>

<mat-dialog-content class="hsl">
  <p class="hsl__blurb">
    The rotating hero at the top of the page. Drag a slide to change the
    running order &mdash; slides save as you edit them, so there is no Save
    on this dialog.
  </p>

  <div class="hsl__grid">
    <app-home-page-images></app-home-page-images>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">DONE</button>
</mat-dialog-actions>
