<div class="manager-content">
  @if (selectedTab === 'Home') {
    <app-page-home></app-page-home>
  }

  <!-- Coaching with Impact had its own block here until 2026-08-29, when it
       became an ordered section stack like the other twelve. It comes from
       EDITABLE_PAGES now, below. -->

  @if (selectedTab === 'Disciple Making Minute') {
    <app-dmms></app-dmms>
  }

  <!-- Web Config also hosts the DOCKING BAR since 2026-08-29 - see
       home.component.ts for why it is not on Home. -->
  @if (selectedTab === 'Web Config') {
    <app-web-config></app-web-config>
  }

  @if (selectedTab === 'Testimonials') {
    <app-testimonials></app-testimonials>
  }

  @if (selectedTab === 'Team Page') {
    <app-team-page></app-team-page>
  }

  <!-- Every public page, driven by ONE catalogue rather than a tab block
       each: which sections a page can have is declared in EDITABLE_PAGES, so
       adding a page is an entry there plus a nav-config leaf, and no change
       here. See page-stack.component.ts.

       About Us had its own block here until 2026-08-29, when it was the only
       page whose template was a dispatcher. All eleven are now, so all eleven
       get the same ordered stack and whole-page preview. -->
  @for (page of editablePages; track page.slug) {
    @if (selectedTab === page.label) {
      <app-page-stack [page]="page"></app-page-stack>
    }
  }
</div>
