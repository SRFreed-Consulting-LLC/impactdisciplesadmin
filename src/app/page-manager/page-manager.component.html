<div class="manager-content">
  <!-- Navigation was a tab here for a day (2026-08-29/30). It is a TOP-LEVEL
       screen now, at /navigation, because the menu is the site's frame
       rather than any one page's content - see NavigationModule. -->

  @if (selectedTab === 'Home') {
    <app-page-home></app-page-home>
  }

  <!-- The Pages LIST screen lived here for a day (2026-08-30) and is gone:
       Shane's call - the left nav IS the list. Created pages are leaves
       (via SitePagesNavService), New Page is the drawer's own "+" row
       (?new=1, handled in the component), and every per-page control lives
       in that page's editor header. -->


  <!-- Coaching with Impact had its own block here until 2026-08-29, when it
       became an ordered section stack like the other twelve. It comes from
       EDITABLE_PAGES now, below. -->

  @if (selectedTab === 'Disciple Making Minute') {
    <app-dmms></app-dmms>
  }

  <!-- Web Config also hosts the DOCKING BAR since 2026-08-29 - see
       home.component.ts for why it is not on Home. -->
  @if (selectedTab === 'Web Config') {
    <app-web-config></app-web-config>
  }

  <!-- Testimonials and Team Page moved to DATA on 2026-08-30: they are
       lists of records the site renders, not a page's own words. -->

  <!-- Every public page, driven by ONE catalogue rather than a tab block
       each: which sections a page can have is declared in EDITABLE_PAGES, so
       adding a page is an entry there plus a nav-config leaf, and no change
       here. See page-stack.component.ts.

       About Us had its own block here until 2026-08-29, when it was the only
       page whose template was a dispatcher. All eleven are now, so all eleven
       get the same ordered stack and whole-page preview. -->
  @for (page of editablePages; track page.slug) {
    @if (selectedTab === page.label) {
      <app-page-stack [page]="page"></app-page-stack>
    }
  }

  <!-- A page staff CREATED, opened from its own leaf (Shane's call,
       2026-08-30: no difference between the pages - every one is a leaf and
       clicking it edits it). dynamicPageSlug is null whenever the selected
       tab is any static screen above, so nothing can render twice. -->
  @if (dynamicPageSlug; as slug) {
    <app-kit-page-editor [slug]="slug"></app-kit-page-editor>
  }
</div>
