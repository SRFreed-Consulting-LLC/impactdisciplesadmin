<app-popup-header [title]="'SUBMISSION: ' + data.item.formName" [showCloseButton]="true" (closed)="onClose()">
  @if (data.item.isTest) {
    <span class="test-chip" popup-header-actions>TEST</span>
  }
</app-popup-header>

<mat-dialog-content>
  <div class="submitted-at">Submitted {{ data.item.submittedAt | date: 'MMM d, y, h:mm a' }}</div>

  <dl class="detail-list">
    @for (row of rows; track row) {
      <dt>{{ row.label }}</dt>
      <dd>{{ row.value }}</dd>
    }
  </dl>

  @if (!rows.length) {
    <div class="no-fields">This form had no data fields.</div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onClose()">CLOSE</button>
</mat-dialog-actions>
