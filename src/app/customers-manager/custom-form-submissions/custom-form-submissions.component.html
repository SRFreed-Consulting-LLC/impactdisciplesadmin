<app-data-grid
  [showColumnsButton]="false"
  [showExportButton]="false"
  [title]="'Custom Form Submissions'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(submissions$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  [rowClass]="rowClass"
  tableClass="custom-form-submissions-table"
  initialSortKey="submittedAt"
  initialSortDirection="desc"
  (rowDoubleClick)="view($event)">
  <ng-template appDataGridCell="formName" let-row>
    {{ row.formName }}
    @if (row.isTest) {
      <span class="test-chip">TEST</span>
    }
  </ng-template>
</app-data-grid>
