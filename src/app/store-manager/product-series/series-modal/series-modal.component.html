<app-popup-header [title]="(isEdit ? 'EDIT' : 'ADD') + ' SERIES'" [showCloseButton]="true" (closed)="onCancel()"></app-popup-header>

<mat-dialog-content [formGroup]="form">
  <div class="field-row">
    <mat-form-field appearance="outline" class="order-field">
      <mat-label>Order</mat-label>
      <input matInput type="number" formControlName="order" required>
      <mat-error *ngIf="form.get('order')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required>
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>
  </div>

  <mat-checkbox formControlName="showInStore">Show In Store?</mat-checkbox>

  <div class="field-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Image</mat-label>
      <input matInput [value]="card.imageUrl?.name ?? ''" readonly>
    </mat-form-field>
    <button mat-stroked-button type="button" [disabled]="inProgress$ | async" (click)="showImageUploader()">Upload Image</button>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="inProgress$ | async" (click)="onCancel()">CANCEL</button>
  <app-indicator-button
    title="SAVE"
    [isInProgress]="inProgress$ | async"
    [disabled]="inProgress$ | async"
    (clicked)="onSave()">
  </app-indicator-button>
</mat-dialog-actions>

<ng-container *ngIf="isImageUploaderVisible$ | async">
  <app-image-uploader
    [card]="card"
    [isList]="false"
    [field]="'imageUrl'"
    [selectionMode]="'single'"
    [imageSelectVisible]="isImageUploaderVisible$ | async"
    (imageSelectClosed)="closeImageUploader()">
  </app-image-uploader>
</ng-container>
