<app-popup-header title="SERIES" [showCloseButton]="true" (closed)="onClose()"></app-popup-header>

<mat-dialog-content>
  <div class="category-actions">
    <button mat-icon-button color="primary" matTooltip="New" (click)="showAddModal()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <app-data-grid
    [showHeader]="false"
    [columns]="columns"
    [rowActions]="rowActions"
    [rows]="(series$ | async) ?? []"
    [loading]="(loading$ | async) ?? false"
    tableClass="series-table"
    initialSortKey="order"
    initialSortDirection="asc"
    (rowDoubleClick)="showEditModal($event)">
    <ng-template appDataGridCell="imageUrl" let-row>
      <img *ngIf="row.imageUrl" width="60" [src]="row.imageUrl.url" [alt]="row.imageUrl.name">
    </ng-template>
  </app-data-grid>
</mat-dialog-content>
