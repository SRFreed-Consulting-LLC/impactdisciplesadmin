<app-popup-header title="SERIES" [showCloseButton]="true" (closed)="onClose()"></app-popup-header>

<mat-dialog-content>
  <div class="category-actions">
    <button mat-icon-button color="primary" matTooltip="New" (click)="showAddModal()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div class="table-scroll">
    <app-table-loading-overlay [loading]="loading$ | async"></app-table-loading-overlay>
    <table mat-table [dataSource]="(series$ | async) ?? []" class="series-table">
      <ng-container matColumnDef="imageUrl">
        <th mat-header-cell *matHeaderCellDef>Image</th>
        <td mat-cell *matCellDef="let item">
          <img *ngIf="item.imageUrl" width="60" [src]="item.imageUrl.url" [alt]="item.imageUrl.name">
        </td>
      </ng-container>

      <ng-container matColumnDef="order">
        <th mat-header-cell *matHeaderCellDef>Order</th>
        <td mat-cell *matCellDef="let item">{{ item.order }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let item">{{ item.name }}</td>
      </ng-container>

      <ng-container matColumnDef="showInStore">
        <th mat-header-cell *matHeaderCellDef>Show In Store</th>
        <td mat-cell *matCellDef="let item">{{ item.showInStore ? 'Yes' : 'No' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
        <td mat-cell *matCellDef="let item" class="actions-column">
          <button mat-icon-button matTooltip="DELETE" (click)="delete(item)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Filter row: one operator+value filter per filterable column, mirroring dxo-filter-row -->
      <ng-container matColumnDef="imageUrl-filter">
        <th mat-header-cell *matHeaderCellDef></th>
      </ng-container>

      <ng-container matColumnDef="order-filter">
        <th mat-header-cell *matHeaderCellDef></th>
      </ng-container>

      <ng-container matColumnDef="name-filter">
        <th mat-header-cell *matHeaderCellDef>
          <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('name', $event)"></app-column-filter>
        </th>
      </ng-container>

      <ng-container matColumnDef="showInStore-filter">
        <th mat-header-cell *matHeaderCellDef></th>
      </ng-container>

      <ng-container matColumnDef="actions-filter">
        <th mat-header-cell *matHeaderCellDef></th>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-header-row *matHeaderRowDef="filterColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="showEditModal(row)"></tr>
    </table>
  </div>
</mat-dialog-content>
