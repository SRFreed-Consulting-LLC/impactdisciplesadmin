<div class="panel-header">
  <h3 class="panel-header__title">Affiliate Sales</h3>
  <button mat-raised-button color="primary" type="button" [disabled]="inProgress" (click)="pay()">PAY</button>
</div>

<div class="table-scroll">
  <table mat-table [dataSource]="(affiliateSales$ | async) ?? []" class="sales-table">
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox (change)="masterToggle()" [checked]="isAllSelected()"></mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let item">
        <mat-checkbox (click)="$event.stopPropagation()" (change)="selection.toggle(item)" [checked]="selection.isSelected(item)"></mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let item">{{ item.date | date }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let item">{{ item.email }}</td>
    </ng-container>

    <ng-container matColumnDef="totalBeforeDiscount">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let item">{{ item.totalBeforeDiscount | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="totalAfterDiscount">
      <th mat-header-cell *matHeaderCellDef>Discounted Total</th>
      <td mat-cell *matCellDef="let item">{{ item.totalAfterDiscount | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="amountPayed">
      <th mat-header-cell *matHeaderCellDef>Payed Amount</th>
      <td mat-cell *matCellDef="let item">{{ item.amountPayed | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="isPayed">
      <th mat-header-cell *matHeaderCellDef>Paid</th>
      <td mat-cell *matCellDef="let item">{{ item.isPayed ? 'Yes' : 'No' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['select', 'date', 'email', 'totalBeforeDiscount', 'totalAfterDiscount', 'amountPayed', 'isPayed']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['select', 'date', 'email', 'totalBeforeDiscount', 'totalAfterDiscount', 'amountPayed', 'isPayed'];"></tr>
  </table>
</div>
