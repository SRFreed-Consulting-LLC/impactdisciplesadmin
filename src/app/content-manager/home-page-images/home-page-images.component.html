<app-data-grid
  [showColumnsButton]="false"
  [showExportButton]="false"
  [title]="itemType + 's'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(items$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  tableClass="images-table"
  initialSortKey="order"
  initialSortDirection="asc"
  exportFileName="home_page_images.xlsx"
  (rowDoubleClick)="showEditModal($event)">
  <ng-template appDataGridCell="isActive" let-row>
    <span class="active-template" [style.background-color]="row.isActive ? '#1d8a46' : '#c62828'">
      {{ row.isActive ? 'LIVE' : 'INACTIVE' }}
    </span>
  </ng-template>
  <ng-template appDataGridCell="image" let-row>
    @if (row.image) {
      <img width="100" [src]="row.image.url" [alt]="row.image.name">
    }
  </ng-template>
</app-data-grid>
