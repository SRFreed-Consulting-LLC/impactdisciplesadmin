<app-popup-header title="Categories" [showCloseButton]="true" (closed)="onClose()"></app-popup-header>

<mat-dialog-content>
  @if (permissionService.canEdit('content-manager.pod-casts')) {
    <div class="category-actions">
      <button mat-icon-button color="primary" matTooltip="New" (click)="showAddModal()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  }

  <app-data-grid
    [showHeader]="false"
    [columns]="columns"
    [rowActions]="rowActions"
    [rows]="(items$ | async) ?? []"
    [loading]="(loading$ | async) ?? false"
    tableClass="category-table"
    initialSortKey="tag"
    initialSortDirection="asc"
    (rowDoubleClick)="showEditModal($event)">
  </app-data-grid>
</mat-dialog-content>
