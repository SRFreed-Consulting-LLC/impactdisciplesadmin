<!-- "Coach" + 's' naive-pluralizes to "Coachs" - hardcoded here instead. -->
<app-list-header title="Coaches" [actions]="actions"></app-list-header>

<div class="table-scroll">
  <app-table-loading-overlay [loading]="loading$ | async"></app-table-loading-overlay>
  <table mat-table [dataSource]="(coaches$ | async) ?? []" class="coaches-table">
    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Live</th>
      <td mat-cell *matCellDef="let item">
        <span class="active-template" [style.background-color]="item.isActive ? '#29d029' : 'red'">
          {{ item.isActive ? 'LIVE' : 'INACTIVE' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="photoUrl">
      <th mat-header-cell *matHeaderCellDef>Picture</th>
      <td mat-cell *matCellDef="let item">
        <img *ngIf="item.photoUrl" width="60" [src]="item.photoUrl.url" [alt]="item.firstName + ' ' + item.lastName">
      </td>
    </ng-container>

    <ng-container matColumnDef="sortOrder">
      <th mat-header-cell *matHeaderCellDef>Sort Order</th>
      <td mat-cell *matCellDef="let item">{{ item.sortOrder }}</td>
    </ng-container>

    <ng-container matColumnDef="teamPageSortOrder">
      <th mat-header-cell *matHeaderCellDef>Team Page Sort Order</th>
      <td mat-cell *matCellDef="let item">{{ item.teamPageSortOrder }}</td>
    </ng-container>

    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef>Last</th>
      <td mat-cell *matCellDef="let item">{{ item.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef>First</th>
      <td mat-cell *matCellDef="let item">{{ item.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let item">{{ item.title }}</td>
    </ng-container>

    <ng-container matColumnDef="organization">
      <th mat-header-cell *matHeaderCellDef>Organization</th>
      <td mat-cell *matCellDef="let item">{{ organizationName(item) }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
      <td mat-cell *matCellDef="let item" class="actions-column">
        <button mat-icon-button matTooltip="DELETE" (click)="delete(item)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Filter row -->
    <ng-container matColumnDef="isActive-filter">
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>
    <ng-container matColumnDef="photoUrl-filter">
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>
    <ng-container matColumnDef="sortOrder-filter">
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>
    <ng-container matColumnDef="teamPageSortOrder-filter">
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>
    <ng-container matColumnDef="lastName-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('lastName', $event)"></app-column-filter>
      </th>
    </ng-container>
    <ng-container matColumnDef="firstName-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('firstName', $event)"></app-column-filter>
      </th>
    </ng-container>
    <ng-container matColumnDef="title-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('title', $event)"></app-column-filter>
      </th>
    </ng-container>
    <ng-container matColumnDef="organization-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('organization', $event)"></app-column-filter>
      </th>
    </ng-container>
    <ng-container matColumnDef="actions-filter">
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-header-row *matHeaderRowDef="filterColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="showEditModal(row)"></tr>
  </table>
</div>
