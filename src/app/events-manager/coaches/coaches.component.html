<!-- "Coach" + 's' naive-pluralizes to "Coachs" - hardcoded here instead. -->
<app-data-grid
  title="Coaches"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(coaches$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  tableClass="coaches-table"
  initialSortKey="sortOrder"
  initialSortDirection="asc"
  exportFileName="coaches.xlsx"
  (rowDoubleClick)="showEditModal($event)">
  <ng-template appDataGridCell="isActive" let-row>
    <span class="active-template" [style.background-color]="row.isActive ? '#29d029' : 'red'">
      {{ row.isActive ? 'LIVE' : 'INACTIVE' }}
    </span>
  </ng-template>
  <ng-template appDataGridCell="photoUrl" let-row>
    <img *ngIf="row.photoUrl" width="60" [src]="row.photoUrl.url" [alt]="row.firstName + ' ' + row.lastName">
  </ng-template>
</app-data-grid>
