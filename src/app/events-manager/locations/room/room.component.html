<app-list-header [title]="itemType" [actions]="actions"></app-list-header>

<div class="table-scroll">
<table mat-table [dataSource]="dataSource" class="rooms-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let item">{{ item.name }}</td>
  </ng-container>

  <ng-container matColumnDef="capacity">
    <th mat-header-cell *matHeaderCellDef>Capacity</th>
    <td mat-cell *matCellDef="let item">{{ item.capacity }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
    <td mat-cell *matCellDef="let item" class="actions-column">
      <button mat-icon-button matTooltip="DELETE" (click)="delete(item)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <!-- Filter row: one operator+value filter per filterable column, mirroring dxo-filter-row -->
  <ng-container matColumnDef="name-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('name', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="capacity-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('capacity', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="actions-filter">
    <th mat-header-cell *matHeaderCellDef></th>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-header-row *matHeaderRowDef="filterColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="showEditModal(row)"></tr>
</table>
</div>
