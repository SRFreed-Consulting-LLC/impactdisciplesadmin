<app-popup-header [title]="(isEdit ? 'EDIT' : 'ADD') + ' LOCATION'" [showCloseButton]="true" (closed)="onCancel()"></app-popup-header>

<mat-dialog-content [formGroup]="form">
  <div class="field-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required>
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contact Name</mat-label>
      <input matInput formControlName="contactName" required>
      <mat-error *ngIf="form.get('contactName')?.hasError('required')">Contact name is required</mat-error>
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Organization</mat-label>
    <mat-select formControlName="organization" required>
      <mat-option *ngFor="let org of data.organizations" [value]="org.id">{{ org.name }}</mat-option>
    </mat-select>
    <mat-error *ngIf="form.get('organization')?.hasError('required')">Organization is required</mat-error>
  </mat-form-field>

  <h3 class="section-title">Address</h3>
  <app-address-field [group]="$any(form.get('address'))"></app-address-field>

  <h3 class="section-title">Phone</h3>
  <app-phone-field [group]="$any(form.get('phone'))"></app-phone-field>

  <h3 class="section-title">Rooms</h3>
  <app-room [trainingRooms]="trainingRooms"></app-room>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="inProgress$ | async" (click)="onCancel()">CANCEL</button>
  <app-indicator-button
    title="SAVE"
    [isInProgress]="inProgress$ | async"
    [disabled]="inProgress$ | async"
    (clicked)="onSave()">
  </app-indicator-button>
</mat-dialog-actions>
