<div class="agenda-shell">
  @if (mode !== 'wizard') {
    <div class="agenda-mode-toolbar">
      <div class="viewtoggle">
        <button type="button" [class.is-on]="mode === 'canvas'" (click)="setMode('canvas')">Canvas</button>
        <button type="button" [class.is-on]="mode === 'grid'" (click)="setMode('grid')">Grid</button>
      </div>
      <span class="spacer"></span>
      <button mat-stroked-button type="button" (click)="setMode('wizard')">
        <mat-icon>restart_alt</mat-icon>
        Rebuild with Wizard
      </button>
    </div>
  }

  @switch (mode) {
    @case ('wizard') {
      <app-agenda-wizard
        [event]="event"
        [coaches]="coaches"
        [rooms]="rooms"
        (published)="onPublished()">
      </app-agenda-wizard>
    }
    @case ('canvas') {
      <app-agenda-canvas [event]="event" [coaches]="coaches" [rooms]="rooms"></app-agenda-canvas>
    }
    @case ('grid') {
      <app-agenda-grid [event]="event" [coaches]="coaches" [rooms]="rooms"></app-agenda-grid>
    }
  }
</div>
