<app-list-header [title]="itemType + 's'" [actions]="actions"></app-list-header>

<div class="table-scroll">
<table mat-table [dataSource]="(announcements$ | async) ?? []" class="announcements-table">
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let item">{{ item.date | date: 'short' }}</td>
  </ng-container>

  <ng-container matColumnDef="sentBy">
    <th mat-header-cell *matHeaderCellDef>Sent By</th>
    <td mat-cell *matCellDef="let item">{{ item.sentBy }}</td>
  </ng-container>

  <ng-container matColumnDef="announcement">
    <th mat-header-cell *matHeaderCellDef>Announcement</th>
    <td mat-cell *matCellDef="let item">{{ item.announcement }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
    <td mat-cell *matCellDef="let item" class="actions-column">
      <button mat-icon-button matTooltip="DELETE" (click)="delete(item)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <!-- Filter row: one operator+value filter per filterable column, mirroring dxo-filter-row -->
  <ng-container matColumnDef="date-filter">
    <th mat-header-cell *matHeaderCellDef></th>
  </ng-container>

  <ng-container matColumnDef="sentBy-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('sentBy', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="announcement-filter">
    <th mat-header-cell *matHeaderCellDef>
      <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('announcement', $event)"></app-column-filter>
    </th>
  </ng-container>

  <ng-container matColumnDef="actions-filter">
    <th mat-header-cell *matHeaderCellDef></th>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-header-row *matHeaderRowDef="filterColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="showEditModal(row)"></tr>
</table>
</div>
