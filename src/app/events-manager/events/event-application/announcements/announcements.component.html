<app-data-grid
  [title]="itemType + 's'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(announcements$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  tableClass="announcements-table"
  initialSortKey="date"
  initialSortDirection="asc"
  exportFileName="event_announcements.xlsx"
  (rowDoubleClick)="showEditModal($event)">
</app-data-grid>
