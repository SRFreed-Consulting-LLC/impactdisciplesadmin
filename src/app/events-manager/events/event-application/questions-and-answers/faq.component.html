<app-data-grid
  title="FAQ"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(faqs$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  [selection]="selection"
  (selectionChange)="onSelectionChange()"
  tableClass="faq-table"
  initialSortKey="sortOrder"
  initialSortDirection="asc"
  exportFileName="faqs.xlsx"
  (rowDoubleClick)="showEditModal($event)">
  <ng-template appDataGridCell="answer" let-row>
    <span [innerHTML]="row.answer"></span>
  </ng-template>
</app-data-grid>
