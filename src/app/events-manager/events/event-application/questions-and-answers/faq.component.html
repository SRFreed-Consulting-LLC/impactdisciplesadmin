<app-list-header title="FAQ" [actions]="actions"></app-list-header>

<div class="table-scroll">
  <app-table-loading-overlay [loading]="loading$ | async"></app-table-loading-overlay>
  <table mat-table [dataSource]="(faqs$ | async) ?? []" class="faq-table">
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox (change)="masterToggle()" [checked]="isAllSelected()"></mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let item">
        <mat-checkbox (click)="$event.stopPropagation()" (change)="toggleRow(item)" [checked]="selection.isSelected(item)"></mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="sortOrder">
      <th mat-header-cell *matHeaderCellDef>Sort Order</th>
      <td mat-cell *matCellDef="let item">{{ item.sortOrder }}</td>
    </ng-container>

    <ng-container matColumnDef="question">
      <th mat-header-cell *matHeaderCellDef>Question</th>
      <td mat-cell *matCellDef="let item">{{ item.question }}</td>
    </ng-container>

    <ng-container matColumnDef="answer">
      <th mat-header-cell *matHeaderCellDef>Answer</th>
      <td mat-cell *matCellDef="let item" class="answer-cell" [innerHTML]="item.answer"></td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
      <td mat-cell *matCellDef="let item" class="actions-column">
        <button mat-icon-button matTooltip="DELETE" (click)="delete(item)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Filter row -->
    <ng-container matColumnDef="select-filter">
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>
    <ng-container matColumnDef="sortOrder-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" type="number" (filterChange)="onFilterChange('sortOrder', $event)"></app-column-filter>
      </th>
    </ng-container>
    <ng-container matColumnDef="question-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('question', $event)"></app-column-filter>
      </th>
    </ng-container>
    <ng-container matColumnDef="answer-filter">
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>
    <ng-container matColumnDef="actions-filter">
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-header-row *matHeaderRowDef="filterColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="showEditModal(row)"></tr>
  </table>
</div>
