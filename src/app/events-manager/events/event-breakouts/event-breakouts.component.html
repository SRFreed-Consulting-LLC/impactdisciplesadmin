<div class="filter-row">
  <app-column-filter [operators]="textOperators" placeholder="Filter by name or email..." (filterChange)="onFilterChange($event)"></app-column-filter>
</div>

<div class="table-scroll">
  <table mat-table [dataSource]="(rows$ | async) ?? []" class="breakouts-table">
    <!-- Group/session header rows share one full-width cell -->
    <ng-container matColumnDef="groupHeader">
      <td mat-cell *matCellDef="let row" class="group-cell" [class.group-cell--breakout]="row.kind === 'breakout'">
        {{ row.label }} — {{ row.count }} registered
      </td>
    </ng-container>

    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef>Last Name</th>
      <td mat-cell *matCellDef="let row">{{ row.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef>First Name</th>
      <td mat-cell *matCellDef="let row">{{ row.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['lastName', 'firstName', 'email']; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: ['groupHeader']; when: isGroupRow" [class.session-row]="row.kind === 'session'"></tr>
    <tr mat-row *matRowDef="let row; columns: ['lastName', 'firstName', 'email']; when: isStudentRow"></tr>
  </table>

  @if ((rows$ | async)?.length === 0) {
    <p class="empty-state">No breakout registrations yet.</p>
  }
</div>

<div class="total-row">Total registered: {{ totalRegistered$ | async }}</div>
