<app-popup-header title="EMAIL REGISTERED USERS" [showCloseButton]="true" (closed)="onCancel()"></app-popup-header>

<mat-dialog-content [formGroup]="form">
  <!-- Where this send is filed. Defaults to the event's live campaign so
       one effort's popup, emails and revenue report together. -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>File this email under</mat-label>
    <mat-select formControlName="campaignId">
      @for (c of campaigns; track c.id) {
        <mat-option [value]="c.id">{{ c.name }}{{ c.status === 'live' ? ' (live)' : '' }}</mat-option>
      }
      <mat-option [value]="NEW_CAMPAIGN">+ Create a new campaign</mat-option>
    </mat-select>
    <mat-hint>Opens, clicks and revenue from this send land on the campaign you choose.</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Subject</mat-label>
    <input matInput formControlName="subject" required>
    @if (form.get('subject')?.hasError('required')) {
      <mat-error>Subject is required</mat-error>
    }
  </mat-form-field>

  <app-variable-inserter [variables]="emailVals" (insert)="insertVariable($event)"></app-variable-inserter>

  <div class="editor-wrap">
    <quill-editor formControlName="html" [modules]="richTextModules" (onEditorCreated)="onEditorCreated($event)"></quill-editor>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="inProgress$ | async" (click)="onCancel()">CANCEL</button>
  <app-indicator-button
    title="SEND"
    [isInProgress]="inProgress$ | async"
    [disabled]="inProgress$ | async"
    (clicked)="onSend()">
  </app-indicator-button>
</mat-dialog-actions>
