<app-data-grid
  [title]="itemType + 's'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [pagedSource]="paged"
  [selection]="selection"
  [rowClass]="rowClass"
  tableClass="attendees-table"
  emptyMessage="No registrations for this event yet."
  exportFileName="attendee_list.xlsx"
  (rowDoubleClick)="showEditModal($event)">
</app-data-grid>
