<app-data-grid
  [title]="itemType + 's'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(courses$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  tableClass="courses-table"
  initialSortKey="title"
  initialSortDirection="asc"
  exportFileName="courses.xlsx"
  (rowDoubleClick)="showEditModal($event)">
</app-data-grid>
