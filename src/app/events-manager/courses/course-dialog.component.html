<app-popup-header [title]="(isEdit ? 'EDIT' : 'ADD') + ' COURSE'" [showCloseButton]="true" (closed)="onCancel()"></app-popup-header>

<mat-dialog-content [formGroup]="form">
  <div class="title-row">
    <mat-form-field appearance="outline" class="title-field">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" required>
      <mat-error *ngIf="form.get('title')?.hasError('required')">Title is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="length-field">
      <mat-label>Length</mat-label>
      <input matInput formControlName="length">
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput formControlName="shortDescription" rows="4" required></textarea>
    <mat-error *ngIf="form.get('shortDescription')?.hasError('required')">Description is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Details</mat-label>
    <textarea matInput formControlName="longDescription" rows="8" required></textarea>
    <mat-error *ngIf="form.get('longDescription')?.hasError('required')">Details is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Resources</mat-label>
    <input matInput formControlName="resources">
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="inProgress$ | async" (click)="onCancel()">CANCEL</button>
  <app-indicator-button
    title="SAVE"
    [isInProgress]="inProgress$ | async"
    [disabled]="inProgress$ | async"
    (onClick)="onSave()">
  </app-indicator-button>
</mat-dialog-actions>
