<app-popup-header [title]="(isEdit ? 'EDIT' : 'ADD') + ' ADMIN USER'" [showCloseButton]="true" (closed)="onCancel()"></app-popup-header>

<mat-dialog-content [formGroup]="form">
  <mat-tab-group class="admin-user-tabs">
    <mat-tab label="Info">
      <div class="tab-content">
        <div class="field-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>First Name</mat-label>
            <input matInput formControlName="firstName" required>
            <mat-error *ngIf="form.get('firstName')?.hasError('required')">First name is required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Last Name</mat-label>
            <input matInput formControlName="lastName" required>
            <mat-error *ngIf="form.get('lastName')?.hasError('required')">Last name is required</mat-error>
          </mat-form-field>
        </div>

        <div class="field-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" required>
            <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Role</mat-label>
            <mat-select formControlName="role" required>
              <mat-option *ngFor="let r of roles" [value]="r">{{ r }}</mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('role')?.hasError('required')">Role is required</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Firebase UID</mat-label>
          <input matInput formControlName="firebaseUID">
        </mat-form-field>

        <h3 class="section-title">Phone Number</h3>
        <app-phone-field [group]="$any(form.get('phone'))"></app-phone-field>
      </div>
    </mat-tab>

    <mat-tab label="Addresses">
      <div class="tab-content">
        <h3 class="section-title">Shipping Address</h3>
        <app-address-field [group]="$any(form.get('shippingAddress'))" [showCountry]="true"></app-address-field>

        <h3 class="section-title">Billing Address</h3>
        <app-address-field [group]="$any(form.get('billingAddress'))" [showCountry]="true"></app-address-field>
      </div>
    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="inProgress$ | async" (click)="onCancel()">CANCEL</button>
  <app-indicator-button
    title="SAVE"
    [isInProgress]="inProgress$ | async"
    [disabled]="inProgress$ | async"
    (onClick)="onSave()">
  </app-indicator-button>
</mat-dialog-actions>
