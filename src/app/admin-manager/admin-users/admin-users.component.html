<app-data-grid
  [title]="itemType + 's'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(users$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  tableClass="admin-users-table"
  initialSortKey="lastName"
  initialSortDirection="asc"
  exportFileName="admin_users.xlsx"
  exportWorksheetName="Admin Users"
  (rowDoubleClick)="showEditModal($event)">
  <ng-template appDataGridCell="phone" let-row>
    {{ row.phone?.countryCode ? '+' + row.phone.countryCode : '' }} {{ row.phone ? (row.phone | phoneNumberMask: false) : '' }}
  </ng-template>
</app-data-grid>
