<app-list-header [title]="itemType + 's'" [actions]="actions"></app-list-header>

<div class="table-scroll">
  <table mat-table [dataSource]="(users$ | async) ?? []" class="users-table">
    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef>Last Name</th>
      <td mat-cell *matCellDef="let item">{{ item.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef>First Name</th>
      <td mat-cell *matCellDef="let item">{{ item.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let item">{{ item.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let item">{{ item.role }}</td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Number</th>
      <td mat-cell *matCellDef="let item">
        {{ item.phone?.countryCode ? '+' + item.phone.countryCode : '' }} {{ item.phone ? (item.phone | phoneNumberMask: false) : '' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
      <td mat-cell *matCellDef="let item" class="actions-column">
        <button mat-icon-button matTooltip="DELETE" (click)="delete(item)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Filter row: one operator+value filter per filterable column, mirroring dxo-filter-row -->
    <ng-container matColumnDef="lastName-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('lastName', $event)"></app-column-filter>
      </th>
    </ng-container>

    <ng-container matColumnDef="firstName-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('firstName', $event)"></app-column-filter>
      </th>
    </ng-container>

    <ng-container matColumnDef="email-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('email', $event)"></app-column-filter>
      </th>
    </ng-container>

    <ng-container matColumnDef="role-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('role', $event)"></app-column-filter>
      </th>
    </ng-container>

    <ng-container matColumnDef="phone-filter">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [operators]="textOperators" (filterChange)="onFilterChange('phone', $event)"></app-column-filter>
      </th>
    </ng-container>

    <ng-container matColumnDef="actions-filter">
      <th mat-header-cell *matHeaderCellDef></th>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-header-row *matHeaderRowDef="filterColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="showEditModal(row)"></tr>
  </table>
</div>
