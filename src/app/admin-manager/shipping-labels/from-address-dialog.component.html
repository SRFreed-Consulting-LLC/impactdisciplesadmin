<app-popup-header title="SET 'FROM' ADDRESS" [showCloseButton]="true" (closed)="onCancel()"></app-popup-header>

<mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" required>
    <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Address</mat-label>
    <input matInput formControlName="addressLine1" required>
    <mat-error *ngIf="form.get('addressLine1')?.hasError('required')">Address is required</mat-error>
  </mat-form-field>

  <div class="field-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>City</mat-label>
      <input matInput formControlName="cityLocality" required>
      <mat-error *ngIf="form.get('cityLocality')?.hasError('required')">City is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>State</mat-label>
      <mat-select formControlName="stateProvince" required>
        <mat-option *ngFor="let state of states" [value]="state.key">{{ state.value }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Zip</mat-label>
      <input matInput formControlName="postalCode" required>
      <mat-error *ngIf="form.get('postalCode')?.hasError('required')">Zip is required</mat-error>
    </mat-form-field>
  </div>

  <div class="field-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Country</mat-label>
      <mat-select formControlName="countryCode" required>
        <mat-option *ngFor="let country of countries" [value]="country.key">{{ country.value }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="phone" required>
      <mat-error *ngIf="form.get('phone')?.hasError('required')">Phone is required</mat-error>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="inProgress$ | async" (click)="onCancel()">CANCEL</button>
  <app-indicator-button
    title="SAVE"
    [isInProgress]="inProgress$ | async"
    [disabled]="inProgress$ | async"
    (onClick)="onSave()">
  </app-indicator-button>
</mat-dialog-actions>
