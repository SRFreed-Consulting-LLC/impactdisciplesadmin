<div class="spinner-overlay" *ngIf="spinnerVisible">
  <mat-spinner diameter="80"></mat-spinner>
</div>

<app-popup-header title="SHIPPING LABEL BATCH" [showCloseButton]="true" (closed)="onClose()"></app-popup-header>

<mat-dialog-content>
  <div class="batch-actions">
    <button mat-stroked-button type="button" [disabled]="inProgress$ | async" (click)="showAddModal()">
      <mat-icon>add</mat-icon>
      New Recipient
    </button>
  </div>

  <app-data-grid
    [showHeader]="false"
    [columns]="columns"
    [rowActions]="rowActions"
    [rows]="(labels$ | async) ?? []"
    [loading]="(loading$ | async) ?? false"
    [showFilterRow]="false"
    tableClass="labels-table"
    (rowDoubleClick)="showEditModal($event)">
  </app-data-grid>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [disabled]="inProgress$ | async" (click)="setFromAddress()">SET 'FROM' ADDRESS</button>
  <button mat-stroked-button type="button" [disabled]="inProgress$ | async" (click)="generateShippingLabels()">GENERATE LABELS</button>
  <button mat-raised-button color="primary" type="button" [disabled]="inProgress$ | async" (click)="onClose()">CLOSE</button>
</mat-dialog-actions>
