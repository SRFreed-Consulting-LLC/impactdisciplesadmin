<app-data-grid
  [title]="itemType + 's'"
  [headerActions]="headerActions"
  [columns]="columns"
  [rowActions]="rowActions"
  [rows]="(batches$ | async) ?? []"
  [loading]="(loading$ | async) ?? false"
  [showFilterRow]="false"
  tableClass="batches-table"
  exportFileName="shipping_label_batches.xlsx"
  (rowDoubleClick)="editBatch($event)">
</app-data-grid>
