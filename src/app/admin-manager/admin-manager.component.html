<div class="manager-content">
  @if (selectedTab === 'Logs') {
    <app-log-messages></app-log-messages>
  }

  @if (selectedTab === 'Admin Users') {
    <app-admin-users></app-admin-users>
  }

  <!-- selectedTab is '' when nothing here is actually granted to this user
  (see admin-manager.component.ts's own comment on why that's the
  default rather than a real screen name) - explain the blank content
  area rather than leaving it silent. -->
  @if (!selectedTab) {
    <div class="no-access-state">You don't have access to anything in Admin Manager.</div>
  }
</div>
