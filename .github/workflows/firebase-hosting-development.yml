name: Deploy to Firebase Hosting (development)

on:
  # Auto-deploy-on-push disabled for now (deploys should be manual only,
  # e.g. `npm run build-deploy-dev`) - kept as a manually-triggerable
  # workflow (Actions tab > Run workflow) rather than deleted outright.
  workflow_dispatch:

# Avoid two deploys racing each other if commits land in quick succession.
concurrency:
  group: firebase-hosting-development
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # NOTE: impactdisciplespwacommon is a private repo. The default
          # GITHUB_TOKEN can only read the repo this workflow runs in, so
          # checking out that submodule will fail until a PAT with read
          # access to it is added as a secret and wired in here (e.g. via
          # `token: ${{ secrets.SUBMODULES_TOKEN }}`).

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (development configuration)
        run: npm run build-dev

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:development \
            --project impactdisciplesdev \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
